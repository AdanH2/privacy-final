<html>
  <head>
    <link rel=stylesheet type=text/css href="{{ url_for('static',
    filename='styles.css') }}">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@floating-ui/core@1.6.9"></script>
    <script src="https://cdn.jsdelivr.net/npm/@floating-ui/dom@1.6.13"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  </head>
  <title>LearnPrivacy</title>
  <body>
    <nav class="navbar navbar-expand-md navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="{{ url_for('index') }}">LearnPrivacy</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarTogglerDemo02"
          aria-controls="navbarTogglerDemo02"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarTogglerDemo02">
          <ul class="navbar-nav me-auto mb-0">
            <li class="nav-item">
              <a
                class="nav-link"
                aria-current="page"
                href="{{ url_for('kAnonymity') }}"
                >K-Anonymity</a
              >
            </li>
            <!-- <li class="nav-item">
              <a class="nav-link" href="{{ url_for('pseudonymization') }}"
                >Pseudonymization</a
              >
            </li> -->
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('dp') }}"
                >Differential Privacy</a
              >
            </li>
          </ul>
          <form class="d-flex my-0 ml-auto">
            <div class="form-check form-switch">
              <input
                class="form-check-input"
                type="checkbox"
                id="flexSwitchCheckDefault"
              />
              <label
                class="form-check-label text-white"
                for="flexSwitchCheckDefault"
                >Toggle to switch to dev mode</label
              >
              <script>
                document
                  .getElementById("flexSwitchCheckDefault")
                  .addEventListener("change", function () {
                    const devMode = this.checked;
                    $.ajax({
                      url: "/toggle_dev_mode",
                      type: "POST",
                      contentType: "application/json",
                      data: JSON.stringify({ dev: devMode }),
                      success: function (response) {
                        window.location.reload();
                      },
                    });
                  });
              </script>
            </div>
          </form>
        </div>
      </div>
    </nav>
    <div class="pt-3">{% block content %}{% endblock %}</div>
    <footer class="footer mt-auto py-3 bg-dark text-white text-center">
      <div class="container">
        <span class="text-muted"
          ><i class="fa-regular fa-copyright"></i> 2025 LearnPrivacy</span
        >
      </div>
    </footer>
    <script>
      var tooltipTriggerList = [].slice.call(
        document.querySelectorAll('[data-bs-toggle="tooltip"]')
      );
      var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
        return new bootstrap.Tooltip(tooltipTriggerEl);
      });
    </script>
  </body>
</html>
